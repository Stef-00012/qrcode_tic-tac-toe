<!DOCTYPE html>
<head>
    <title>Tic Tac Toe</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: monospace;
            background-color: black
        }

        .container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%)
        }

        button {
            margin-top: 5px;
            margin-bottom: 5px;
            width: 60px;
            height: 60px;
            background-color: black;
            border: none;
            color: white;
            font-size: 40px;
            border: solid 1px transparent
        }

        .top {
            border-top-color: white
        }

        .left {
            border-left-color: white
        }

        .right {
            border-right-color: white
        }

        .bottom {
            border-bottom-color: white
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <button class="right bottom" id="a1" onclick="play(this.id)">&#8203</button>
            <button class="left right bottom" id="a2" onclick="play(this.id)">&#8203</button>
            <button class="left bottom" id="a3" onclick="play(this.id)">&#8203</button>
        </div>
        <div>
            <button class="top right bottom" id="b1" onclick="play(this.id)">&#8203</button>
            <button class="top bottom right left" id="b2" onclick="play(this.id)">&#8203</button>
            <button class="top left bottom" id="b3" onclick="play(this.id)">&#8203</button>
        </div>
        <div>
            <button class="top right" id="c1" onclick="play(this.id)">&#8203</button>
            <button class="left top right" id="c2" onclick="play(this.id)">&#8203</button>
            <button class="top left" id="c3" onclick="play(this.id)">&#8203</button>
        </div>
    </div>
</body>
<script>
    let turn="X";const combinations=[["a1","a2","a3"],["b1","b2","b3"],["c1","c2","c3"],["a1","b1","c1"],["a2","b2","c2"],["a3","b3","c3"],["a1","b2","c3"],["a3","b2","c1"]],allButtons=document.querySelectorAll("button");function play(a){a=document.getElementById(a);a.innerText=turn;a.disabled=!0;checkWinner();turn="X"==turn?"O":"X"}function checkWinner(){for(var a of combinations){const [b,e,f]=a,c=document.getElementById(b).innerText,d=document.getElementById(e).innerText,g=document.getElementById(f).innerText;if(["X","O"].includes(c)&&c===d&&d===g)return alert(`${c} wins!`),reset()}a=[];for(const b of allButtons)b.disabled||a.push(b);0==a.length&&(alert("It's a tie"),reset())}function reset(){for(const a of allButtons)a.disabled=!1,a.innerHTML="&#8203";turn="X"};
</script>
