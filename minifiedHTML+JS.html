ment.getElementById(n).innerText,c=document.getElementById(l).innerText;if(["X","O"].includes(r)&&r===i&&i===c)return alert(`${r} wins!`),reset()}let o=[];for(let a of allButtons)a.disabled||o.push(a);0==o.length&&(alert("It's a tie"),reset())}function reset(){for(let e of allButtons)e.disabled=!1,e.innerText="​";turn="X"}</script></head>
